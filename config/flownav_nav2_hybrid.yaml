controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odom
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [short_goal]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 8.0
    short_goal:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 3.14
      stateful: false
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: DiffDrive
      time_steps: 30
      model_dt: 0.05
      batch_size: 500
      iteration_count: 1
      vx_std: 0.12
      wz_std: 0.25
      vx_max: 0.20
      vx_min: 0.0
      wz_max: 0.6
      ax_max: 0.4
      ax_min: -0.5
      az_max: 0.8
      temperature: 0.3
      gamma: 0.015
      visualize: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, PathAlignCritic, PathFollowCritic, PreferForwardCritic]
      CostCritic:
        cost_weight: 5.0
        consider_footprint: true
        collision_cost: 1000000.0
      PathAlignCritic:
        cost_weight: 14.0
        offset_from_furthest: 2
      PathFollowCritic:
        cost_weight: 5.0
        offset_from_furthest: 1

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 2.0
      rolling_window: true
      track_unknown_space: false
      width: 3
      height: 3
      resolution: 0.05
      footprint: '[[0.075, 0.150], [0.075, -0.150], [-0.460, -0.150], [-0.460, 0.150]]'
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          max_obstacle_height: 0.8
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
          expected_update_rate: 0.2
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.5
        cost_scaling_factor: 5.0

velocity_smoother_flownav:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.20, 0.0, 0.6]
    min_velocity: [0.0, 0.0, -0.6]
    max_accel: [0.4, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -0.8]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /flownav/cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_external
    source_timeout: 0.3
    stop_pub_timeout: 1.0
    polygons: [FrontStop, FootprintApproach]
    FrontStop:
      type: polygon
      points: [0.325, 0.19, 0.325, -0.19, 0.05, -0.19, 0.05, 0.19]
      action_type: stop
      max_points: 2
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 2.0
      simulation_time_step: 0.1
      max_points: 3
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true
